[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-ai-test"
version = "0.1.0"
description = "Deterministic Playwright test runner with CDP stream verification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50,<2",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
  "typer>=0.15,<1",
  "rich>=13,<15",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]
[project.scripts]
browser-ai-test = "browser_ai_test.cli:app"
[tool.hatch.build.targets.wheel]
packages = ["src/browser_ai_test"]
[tool.pytest.ini_options]
pythonpath = ["src"]
