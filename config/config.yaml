browser:
  cdp_url: "http://127.0.0.1:9222"
  headless: false
  cdp_timeout_seconds: 10
  bypass_proxy_for_loopback: true
execution:
  # browser_use 使用大模型；playwright 使用完全固定脚本，不创建模型或 Browser Use Agent。
  mode: browser_use
system:
  url: "https://example.test"
  iframe_hint: "business iframe"
  iframe_selector: null
llm:
  # browser_use/openai/openai_compatible/anthropic/google/custom
  provider: browser_use
  model: null
  base_url: null
  api_key_env: null
  # provider=custom 时填写，例如 "my_package.models.MyBrowserUseModel"
  class_path: null
  kwargs:
    temperature: 0
agent:
  max_steps: 100
  # 每个 Case 都会执行的公共步骤，例如登录、切换租户或关闭弹窗。
  instructions: []
upload:
  directory: "data/uploads"
  input_selector: "input[type='file']"
  target: auto
  timeout_ms: 10000
workflow:
  login:
    enabled: false
    username_env: TEST_USERNAME
    password_env: TEST_PASSWORD
    username_selector: "input[name='username']"
    password_selector: "input[name='password']"
    submit_selector: "button[type='submit']"
  # 固定模式初始化步骤：点击 testcc 卡片、新增 API、打开 AI 助手等。
  setup_steps: []
  question_selector: "textarea"
  send_selector: "button[type='submit']"
  answer_selector: "[data-testid='answer']"
  target: iframe
  refresh_action: reload
  refresh_selector: null
  ui_timeout_ms: 10000
stream:
  protocol: "sse"
  url_keywords:
    - "/api/chat/stream"
    - "/api/generate"
  timeout_seconds: 120
  done_markers:
    - "[DONE]"
    - '"type":"done"'
    - '"status":"completed"'
    - '"event":"finish"'
database:
  path: "data/results.db"
runner:
  continue_on_failure: true
  case_interval_seconds: 1
  retry_count: 0
logging:
  level: INFO
report:
  html_directory: "reports"
