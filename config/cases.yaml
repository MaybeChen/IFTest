cases:
  - id: QA_001
    name: 日本首都测试
    question: "日本的首都是哪里？"
    expected:
      type: keyword
      values: [东京]
      match_mode: all
    stream:
      protocol: sse
    timeout_seconds: 120
  - id: QA_002
    name: 数学测试
    question: "1+1等于多少？"
    expected:
      type: regex
      values: ["(^|[^0-9])2([^0-9]|$)"]
    stream:
      protocol: sse
    timeout_seconds: 60
